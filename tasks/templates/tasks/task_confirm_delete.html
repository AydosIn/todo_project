{% extends 'tasks/base.html' %}

{% block title %}Delete Task{% endblock %}

{% block content %}
    <h1>Delete "{{ task.title }}"?</h1>
    <p>This cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'task_detail' task.pk %}">Cancel</a>
    </form>
{% endblock %}
