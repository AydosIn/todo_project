{% extends 'base.html' %}

{% block title %}Delete task{% endblock %}

{% block content %}
<div class="card form-card">
    <h1>Delete this task?</h1>
    <p>"<strong>{{ task.title }}</strong>" will be removed permanently. This cannot be undone.</p>

    <form method="post" class="actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'task_detail' task.pk %}" class="btn btn-ghost">Cancel</a>
    </form>
</div>
{% endblock %}
