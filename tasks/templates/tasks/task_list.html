{% extends 'tasks/base.html' %}

{% block title %}My Tasks{% endblock %}

{% block content %}
    <h1>My Tasks</h1>
    <ul>
        {% for task in tasks %}
            <li>
                <a href="{% url 'task_detail' task.pk %}">{{ task.title }}</a>
                {% if task.completed %}✅{% endif %}
            </li>
        {% empty %}
            <li>No tasks yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
