{% extends 'tasks/base.html' %}

{% block title %}{% if task %}Edit Task{% else %}New Task{% endif %}{% endblock %}

{% block content %}
    <h1>{% if task %}Edit "{{ task.title }}"{% else %}New Task{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
{% endblock %}
